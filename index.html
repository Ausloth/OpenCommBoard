<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAC Icon Board Builder</title>
    <!-- FIXED: Tailwind CSS via official Play CDN for GitHub pages resilience -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {}
        }
      }
    </script>
    <style>
      /* Fallback styles in case Tailwind CDN fails */
      body { font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; margin: 0; }
      .app-container { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      @media (min-width: 768px) { .app-container { flex-direction: row; } }
      .print-hide { display: block; }
      
      @layer utilities {
        .break-inside-avoid {
          page-break-inside: avoid;
          break-inside: avoid;
        }
      }

      @media print {
        @page { margin: 1cm; size: landscape; }
        body { background: white !important; }
        .print-hide { display: none !important; }
        .print-expand { width: 100% !important; height: 100% !important; border: none !important; box-shadow: none !important; }
        #app { display: block; }
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 font-sans h-screen w-screen overflow-hidden flex flex-col md:flex-row print:block print:bg-white print:h-auto print:w-auto overflow-y-auto">
    <div id="app" class="app-container w-full h-full">
      <!-- Fallback UI while loading JS -->
      <div class="p-8 text-center w-full">
        <h1 class="text-2xl font-bold">Loading AAC Board Builder...</h1>
        <p class="text-gray-500 mt-2">If this screen persists, JavaScript may be blocked or failed to load.</p>
      </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
      // FIXED: Robust initialization using DOMContentLoaded
      document.addEventListener('DOMContentLoaded', () => {
        try {
          initApp();
        } catch (e) {
          console.error("Critical initialization failure:", e);
          document.getElementById('app').innerHTML = `<div class="p-8 text-red-600"><h2>App Failed to Load</h2><p>${e.message}</p></div>`;
        }
      });

      const DEFAULT_CELL = { text: "", image: "", bgColor: "#ffffff", textColor: "#000000" };

      let state = {
        title: "My Communication Board",
        rows: 4, cols: 4,
        mode: "edit", activeCellId: null,
        cells: []
      };

      function initApp() {
        const app = document.getElementById('app');
        app.className = "flex w-full h-full";
        // Setup initial UI
        app.innerHTML = `
          <aside id="sidebar" class="w-full md:w-80 border-r border-gray-200 bg-white flex flex-col h-auto md:h-full shadow-sm print-hide p-6 overflow-y-auto z-10">
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-gray-800">🗣️ AAC Builder</h1>
              <p class="text-sm text-gray-500 mt-1">Design & Print Comm Boards</p>
            </div>
            <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-lg mb-6 shadow-inner">
              <button id="btn-mode-edit" class="flex-1 py-2 font-semibold text-sm rounded bg-white shadow text-blue-600 border border-blue-200">✏️ Edit Mode</button>
              <button id="btn-mode-use" class="flex-1 py-2 font-semibold text-sm rounded text-gray-600">🗣️ Use Mode</button>
            </div>
            <div class="space-y-4 mb-6" id="panel-settings">
              <h2 class="font-bold text-gray-700 uppercase text-xs">Settings</h2>
              <div>
                <label class="block text-sm font-medium mb-1">Board Title</label>
                <input type="text" id="input-title" value="${state.title}" class="w-full px-3 py-2 border rounded focus:ring-2 outline-none" />
              </div>
              <div class="flex gap-4">
                <div class="flex-1">
                  <label class="block text-sm font-medium mb-1">Cols: <span id="val-cols">4</span></label>
                  <input type="range" id="slider-cols" min="2" max="10" value="4" class="w-full" />
                </div>
                <div class="flex-1">
                  <label class="block text-sm font-medium mb-1">Rows: <span id="val-rows">4</span></label>
                  <input type="range" id="slider-rows" min="2" max="10" value="4" class="w-full" />
                </div>
              </div>
              <div id="print-warning" class="hidden text-xs text-amber-700 bg-amber-50 border p-2 rounded">
                 ⚠️ Warning: Grids larger than 6x6 may be hard to read printed.
              </div>
            </div>
            <div class="space-y-3 mb-6" id="panel-templates">
              <h2 class="font-bold text-xs uppercase">Templates</h2>
              <div class="grid grid-cols-2 gap-2">
                <button id="btn-template-cafe" class="px-2 py-2 border text-blue-700 bg-blue-50 rounded text-sm hover:bg-blue-100">☕ Cafe Board</button>
                <button id="btn-template-clear" class="px-2 py-2 border text-red-600 bg-red-50 rounded text-sm hover:bg-red-100">🧹 Clear Grid</button>
              </div>
            </div>
            <div class="mt-auto space-y-2 pt-4 border-t">
              <button id="btn-print" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded shadow">🖨️ Print (A4)</button>
              <div class="grid grid-cols-2 gap-2">
                <button id="btn-export-json" class="py-2 bg-gray-200 rounded text-sm font-semibold">💾 Save</button>
                <label class="flex justify-center py-2 bg-gray-200 rounded text-sm font-semibold cursor-pointer">
                  📂 Load
                  <input type="file" id="input-import-json" accept=".json" class="hidden" />
                </label>
              </div>
            </div>
          </aside>
          
          <main class="flex-1 flex flex-col items-center p-4 md:p-8 bg-gray-50 print-expand print:bg-white w-full overflow-y-auto w-full">
            <h2 id="board-display-title" class="text-3xl font-bold mb-4 print:mb-2">${state.title}</h2>
            <div class="flex-1 w-full rounded flex justify-center break-inside-avoid print:p-0">
               <div id="grid" class="grid gap-2 w-full max-w-5xl aspect-[4/3] print:h-auto print:border-none print:gap-[2mm]"></div>
            </div>
          </main>

          <dialog id="edit-modal" class="p-0 border-0 rounded-xl shadow-2xl backdrop:bg-gray-900/60 flex-col w-[95%] max-w-3xl bg-white m-auto hidden open:flex">
            <div class="flex justify-between items-center border-b p-4 bg-gray-50">
              <h3 class="text-xl font-bold">✏️ Edit Cell</h3>
              <button id="btn-close-modal" class="text-gray-500 font-bold px-2 py-1 bg-gray-200 rounded hover:bg-gray-300">Close</button>
            </div>
            <div class="p-6 flex flex-col md:flex-row gap-6">
              <div class="flex-1 space-y-4">
                <label class="block text-sm font-semibold">Text Label</label>
                <input type="text" id="cell-text" class="w-full px-3 py-2 border rounded" />
                
                <label class="block text-sm font-semibold">Background Color</label>
                <div class="flex items-center gap-2">
                  <input type="color" id="cell-color" value="#ffffff" class="w-10 h-10 border p-0 rounded cursor-pointer" />
                  <button class="preset-color w-8 h-8 rounded border bg-white border-gray-300" data-color="#ffffff"></button>
                  <button class="preset-color w-8 h-8 rounded border bg-blue-100 border-blue-300" data-color="#dbeafe"></button>
                  <button class="preset-color w-8 h-8 rounded border bg-green-100 border-green-300" data-color="#dcfce3"></button>
                  <button class="preset-color w-8 h-8 rounded border bg-yellow-100 border-yellow-300" data-color="#fef08a"></button>
                  <button class="preset-color w-8 h-8 rounded border bg-red-100 border-red-300" data-color="#fee2e2"></button>
                </div>
                <label class="block text-sm font-semibold">Text Color</label>
                <input type="color" id="cell-text-color" value="#000000" class="w-10 h-10 border p-0 rounded" />
              </div>
              <div class="border-l hidden md:block"></div>
              <div class="flex-[1.5] flex flex-col gap-2">
                <label class="text-sm font-semibold flex justify-between">Icon Search <span class="text-xs text-blue-500">OpenSymbols API</span></label>
                <div class="flex gap-2">
                  <input type="text" id="icon-search-input" placeholder="Keyword (e.g., eat, drink)" class="flex-1 px-3 py-2 border rounded text-sm"/>
                  <button id="btn-search-icon" class="px-3 bg-blue-100 text-blue-800 rounded font-bold border border-blue-200 hover:bg-blue-200">Search</button>
                </div>
                <div id="icon-results" class="grid grid-cols-4 gap-2 h-48 overflow-y-auto border bg-gray-50 rounded p-2 content-start"></div>
                <label class="text-xs font-semibold mt-auto mt-2">Custom Upload:</label>
                <input type="file" id="input-upload-image" accept="image/*" class="w-full text-sm border rounded p-1"/>
              </div>
            </div>
            <div class="border-t bg-gray-50 p-4 flex justify-between items-center">
              <button id="btn-remove-icon" class="text-red-600 font-bold hover:underline text-sm">🗑️ Remove Icon</button>
              <div class="flex gap-2">
                <button id="btn-modal-cancel" class="px-4 py-2 border bg-white rounded font-semibold hover:bg-gray-100">Cancel</button>
                <button id="btn-modal-save" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">Save</button>
              </div>
            </div>
          </dialog>
        `;

        setupListeners();
        syncCells();
        loadCafeTemplate();
      }

      function setupListeners() {
        const byId = id => document.getElementById(id);
        
        byId('slider-cols').addEventListener('input', e => { state.cols = parseInt(e.target.value); byId('val-cols').textContent = state.cols; syncCells(); });
        byId('slider-rows').addEventListener('input', e => { state.rows = parseInt(e.target.value); byId('val-rows').textContent = state.rows; syncCells(); });
        byId('input-title').addEventListener('input', e => { state.title = e.target.value; byId('board-display-title').textContent = state.title; });

        byId('btn-mode-edit').addEventListener('click', () => setMode('edit'));
        byId('btn-mode-use').addEventListener('click', () => setMode('use'));
        byId('btn-template-cafe').addEventListener('click', loadCafeTemplate);
        byId('btn-template-clear').addEventListener('click', () => { if(confirm("Clear board?")) clearBoard(); });

        byId('btn-close-modal').addEventListener('click', closeModal);
        byId('btn-modal-cancel').addEventListener('click', closeModal);
        byId('btn-modal-save').addEventListener('click', saveModalDetails);
        byId('btn-remove-icon').addEventListener('click', () => {
          const c = state.cells.find(x => x.id === state.activeCellId);
          if(c) { c.image = ''; saveModalDetails(); }
        });

        document.querySelectorAll('.preset-color').forEach(btn => {
          btn.addEventListener('click', e => byId('cell-color').value = e.target.dataset.color);
        });

        byId('btn-search-icon').addEventListener('click', searchIcons);
        byId('icon-search-input').addEventListener('keydown', e => { if(e.key === 'Enter') searchIcons(); });
        byId('input-upload-image').addEventListener('change', handleUpload);

        byId('btn-print').addEventListener('click', () => window.print());
        byId('btn-export-json').addEventListener('click', () => {
          const dl = document.createElement('a');
          dl.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
          dl.download = "aac-board.json";
          dl.click();
        });
        byId('input-import-json').addEventListener('change', e => {
          const r = new FileReader();
          r.onload = ev => {
            try { 
              const d = JSON.parse(ev.target.result); 
              if(d.cells) { state = d; initApp(); } 
            } catch(err) { alert("Invalid JSON"); }
          };
          if(e.target.files[0]) r.readAsText(e.target.files[0]);
        });
      }

      function syncCells() {
        const t = state.rows * state.cols;
        state.cells = state.cells.slice(0, t);
        while(state.cells.length < t) state.cells.push({ id: "c_" + Math.random(), ...DEFAULT_CELL });
        // Check warning
        document.getElementById('print-warning').className = (state.cols > 6 || state.rows > 6) ? "text-xs text-amber-700 bg-amber-50 border p-2 rounded block mb-2" : "hidden";
        renderGrid();
      }

      function setMode(mode) {
        state.mode = mode;
        const e = document.getElementById('btn-mode-edit');
        const u = document.getElementById('btn-mode-use');
        if (mode === 'edit') {
           e.className = "flex-1 py-2 font-semibold text-sm rounded bg-white shadow text-blue-600 border border-blue-200";
           u.className = "flex-1 py-2 font-semibold text-sm rounded text-gray-600 bg-transparent shadow-none border border-transparent";
        } else {
           u.className = "flex-1 py-2 font-semibold text-sm rounded bg-white shadow text-blue-600 border border-blue-200";
           e.className = "flex-1 py-2 font-semibold text-sm rounded text-gray-600 bg-transparent shadow-none border border-transparent";
        }
        renderGrid();
      }

      function renderGrid() {
        const g = document.getElementById('grid');
        g.style.gridTemplateColumns = 'repeat(' + state.cols + ', minmax(0,1fr))';
        g.style.gridTemplateRows = 'repeat(' + state.rows + ', minmax(0,1fr))';
        g.innerHTML = '';
        state.cells.forEach(c => {
          const el = document.createElement('button');
          el.className = "flex flex-col items-center justify-center p-2 border-2 transition-transform overflow-hidden relative break-inside-avoid print:p-1 w-full h-full text-center";
          el.style.backgroundColor = c.bgColor;
          el.style.borderColor = "#cbd5e1"; // Generic gray fallback border
          el.style.color = c.textColor;
          if(state.mode === 'edit') el.classList.add('hover:ring-4', 'ring-blue-300', 'cursor-pointer', 'rounded-lg');
          else el.classList.add('hover:scale-[1.02]', 'cursor-pointer', 'rounded-xl', 'shadow-sm', 'print:shadow-none');
          
          el.onclick = () => {
            if(state.mode === 'edit') {
              state.activeCellId = c.id;
              const m = document.getElementById('edit-modal');
              document.getElementById('cell-text').value = c.text;
              document.getElementById('cell-color').value = c.bgColor;
              document.getElementById('cell-text-color').value = c.textColor;
              document.getElementById('icon-results').innerHTML = '';
              m.classList.remove('hidden'); m.showModal();
            } else {
              // TTS Fallback
              if(c.text && window.speechSynthesis) window.speechSynthesis.speak(new SpeechSynthesisUtterance(c.text));
              el.style.opacity = '0.5'; setTimeout(()=> el.style.opacity='1', 200);
            }
          };

          if(c.image) el.innerHTML += '<img src="' + c.image + '" class="flex-1 w-full max-h-[70%] object-contain pointer-events-none mb-1 shadow-none" onerror="this.style.display=\'none\'"/>';
          el.innerHTML += '<span class="font-bold uppercase tracking-tight text-sm md:text-lg ' + (!c.image ? 'my-auto' : '') + '">' + (c.text || (state.mode === 'edit' ? '+' : '')) + '</span>';
          g.appendChild(el);
        });
      }

      function closeModal() { document.getElementById('edit-modal').close(); document.getElementById('edit-modal').classList.add('hidden'); }
      function saveModalDetails() {
        const c = state.cells.find(x => x.id === state.activeCellId);
        if(c) {
          c.text = document.getElementById('cell-text').value;
          c.bgColor = document.getElementById('cell-color').value;
          c.textColor = document.getElementById('cell-text-color').value;
        }
        renderGrid(); closeModal();
      }

      // FIXED: Optional robust API call
      async function searchIcons() {
        const q = document.getElementById('icon-search-input').value;
        const res = document.getElementById('icon-results');
        if(!q) return;
        res.innerHTML = '<p class="col-span-full">Searching...</p>';
        try {
          const r = await fetch('https://www.opensymbols.org/api/v2/symbols?q=' + encodeURIComponent(q));
          if(!r.ok) throw new Error("HTTP error " + r.status);
          const data = await r.json();
          res.innerHTML = '';
          if(data.length === 0) { res.innerHTML='<p class="col-span-full">No results</p>'; return; }
          data.slice(0,20).forEach(i => {
             const b = document.createElement('button');
             b.className = 'border p-1 hover:bg-blue-100 rounded flex flex-col items-center justify-center bg-white h-16 w-16';
             b.innerHTML = '<img src="' + i.image_url + '" class="w-full h-full object-contain cursor-pointer" crossOrigin="anonymous"/>';
             b.onclick = async () => {
                const c = state.cells.find(x => x.id === state.activeCellId);
                res.innerHTML = '<p class="col-span-full text-blue-600">Processing image...</p>';
                try { c.image = await processImage(i.image_url); saveModalDetails(); }
                catch(e) { c.image = i.image_url; saveModalDetails(); } // fallback to direct URL
             };
             res.appendChild(b);
          });
        } catch(e) {
          console.error(e);
          res.innerHTML = '<p class="text-red-500 col-span-full text-xs">Search failed. API might be blocked (CORS/Adblock). Upload an image instead.</p>';
        }
      }

      async function processImage(urlOrFile) {
        return new Promise((resolve, reject) => {
          const img = new Image(); img.crossOrigin = 'Anonymous';
          img.onload = () => {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            cvs.width = 300; cvs.height = cvs.height = 300 * (img.height/img.width);
            ctx.drawImage(img,0,0, cvs.width, cvs.height);
            resolve(cvs.toDataURL('image/png'));
          };
          img.onerror = reject;
          img.src = urlOrFile instanceof File ? URL.createObjectURL(urlOrFile) : urlOrFile;
        });
      }

      async function handleUpload(e) {
         if(!e.target.files[0]) return;
         try {
           const b64 = await processImage(e.target.files[0]);
           const c = state.cells.find(x => x.id === state.activeCellId);
           if(c) { c.image = b64; saveModalDetails(); }
         } catch(e) { alert("Failed to process image."); }
      }

      function clearBoard() { state.cells.forEach(c => { c.text=''; c.image=''; c.bgColor='#ffffff'; }); renderGrid(); }
      function loadCafeTemplate() {
        document.getElementById('slider-rows').value = 4;
        document.getElementById('slider-cols').value = 5;
        state.rows = 4; state.cols = 5; syncCells();
        const demo = [{t:"I want",c:"#dbeafe"},{t:"Coffee",c:"#fef08a"},{t:"Tea",c:"#fef08a"},{t:"Juice",c:"#fef08a"},{t:"Water",c:"#e0f2fe"},{t:"Please",c:"#dcfce3"},{t:"Hot",c:"#ffedd5"},{t:"Cold",c:"#e0f2fe"},{t:"Milk",c:"#f3f4f6"},{t:"Sugar",c:"#f3f4f6"},{t:"Yes",c:"#dcfce3"},{t:"No",c:"#fee2e2"},{t:"Stop",c:"#fee2e2"},{t:"Thank You",c:"#dcfce3"},{t:"More",c:"#dbeafe"}];
        state.cells.forEach((c,i) => { if(demo[i]) { c.text=demo[i].t; c.bgColor=demo[i].c; c.image=''; } });
        state.title = "Cafe Order Board"; document.getElementById('input-title').value = state.title;
        renderGrid();
      }
    </script>
  </body>
</html>
